<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>

<style>
body{background:#0f0f0f;color:#fff;font-family:Tahoma}
.admin{width:90%;margin:40px auto;background:#1c1c1c;padding:20px;border-radius:10px}
h2{color:#f5c542}
input,textarea,select,button{
    width:100%;
    margin-bottom:10px;
    padding:10px;
    border-radius:5px;
    border:none
}
button{background:#f5c542;font-weight:bold;cursor:pointer}
.card{background:#000;padding:10px;border-radius:5px;margin-top:10px}
.del{background:red;color:#fff;margin-top:5px}
small{color:#aaa}
</style>
</head>

<body>

<div class="admin">
<h2>🛠️ لوحة تحكم الأدمن</h2>

<input id="title" placeholder="اسم الحساب">
<textarea id="desc" placeholder="الوصف"></textarea>
<input id="price" placeholder="السعر">

<!-- رفع عدة صور -->
<input type="file" id="images" multiple accept="image/*">
<small>يمكنك اختيار أكثر من صورة</small>

<select id="type">
<option value="global">عالمي</option>
<option value="korea">كوري</option>
<option value="vietnam">فيتنامي</option>
</select>

<button onclick="add()">➕ إضافة الحساب</button>

<div id="list"></div>
</div>

<script>
let accounts = JSON.parse(localStorage.getItem("accounts")) || [];

function save(){
    localStorage.setItem("accounts", JSON.stringify(accounts));
    render();
}

function add(){
    const files = images.files;
    if(!files.length){
        alert("⚠️ اختر صور للحساب");
        return;
    }

    let imgs = [];
    let loaded = 0;

    for(let file of files){
        let reader = new FileReader();
        reader.onload = e=>{
            imgs.push(e.target.result);
            loaded++;
            if(loaded === files.length){
                accounts.push({
                    title: title.value,
                    desc: desc.value,
                    price: price.value,
                    images: imgs,
                    type: type.value
                });
                save();
                clearForm();
            }
        };
        reader.readAsDataURL(file);
    }
}

function del(i){
    if(confirm("هل تريد حذف الحساب؟")){
        accounts.splice(i,1);
        save();
    }
}

function render(){
    list.innerHTML='';
    accounts.forEach((a,i)=>{
        list.innerHTML += `
        <div class="card">
            <b>${a.title}</b><br>
            ${a.price}$<br>
            <small>عدد الصور: ${a.images.length}</small>
            <button class="del" onclick="del(${i})">حذف</button>
        </div>`;
    });
}

function clearForm(){
    title.value='';
    desc.value='';
    price.value='';
    images.value='';
}

render();
</script>

</body>
</html>
